name: ChatGPT Remotion Render

on:
  push:
    branches:
      - chore/chatgpt-remotion-run
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Render Remotion demo
        run: pnpm render:demo

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-remotion-demo
          path: apps/remotion-studio/out/motion-agent-demo.mp4
          if-no-files-found: error
