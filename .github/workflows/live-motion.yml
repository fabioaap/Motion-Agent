name: Live Motion Smoke

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenAI model ID
        required: false
        default: gpt-5.6
      prompt:
        description: Motion request
        required: false
        default: '@motion --auto anime o dashboard preservando o SVG original e destacando a oportunidade principal'

permissions:
  contents: read

jobs:
  live-motion:
    runs-on: ubuntu-latest
    env:
      MOTION_MODEL: ${{ inputs.model }}
      MOTION_REASONING_EFFORT: high
      MOTION_VISUAL_MAX_DIFF: '0.005'
      MOTION_QA_KEYFRAMES: '7'
      MOTION_MAX_QA_CYCLES: '6'
      MOTION_MAX_EQUIVALENT_FAILURES: '3'
      MOTION_USER_PROMPT: ${{ inputs.prompt }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require API key and Drive delivery credentials
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MOTION_OS_DRIVE_FOLDER_ID: ${{ vars.MOTION_OS_DRIVE_FOLDER_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          for var in OPENAI_API_KEY MOTION_OS_DRIVE_FOLDER_ID GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_REFRESH_TOKEN; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing repository variable or secret: $var. See docs/motion-os-drive-runbook.md"
              exit 1
            fi
          done
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - name: Run live @motion graph
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: pnpm motion -- "$MOTION_USER_PROMPT" --asset apps/remotion-studio/public/demo/dashboard.svg --approve
      - name: Deliver generated motion and QA directly to Google Drive
        shell: bash
        env:
          MOTION_OS_DRIVE_FOLDER_ID: ${{ vars.MOTION_OS_DRIVE_FOLDER_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          MOTION_WORKFLOW_ID: live_motion
          MOTION_RENDER_QUALITY: review
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          videos=(apps/remotion-studio/out/jobs/*.mp4)
          if (( ${#videos[@]} == 0 )); then
            echo '::error::No MP4 generated by live motion.'
            exit 1
          fi
          reports=(apps/remotion-studio/out/qa/**/*.json apps/remotion-studio/out/qa/**/*.png apps/remotion-studio/out/qa/**/*.jpg apps/remotion-studio/jobs/generated/*.json)
          node scripts/upload-motion-render-to-drive.mjs "${videos[@]}" "${reports[@]}"
          echo 'Drive delivery verified. No GitHub Actions artifact created.'
