name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: motion-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm installer:smoke
      - run: pnpm installer:package-smoke
      - run: pnpm tools:smoke
      - run: pnpm --filter @motion-agent/node-tools preview-smoke
      - run: pnpm demo
      - run: pnpm demo:command
      - run: pnpm --filter @motion-agent/remotion-studio compositions
      - run: pnpm render:demo
      - run: pnpm render:job
      - run: pnpm render:scene
      - run: pnpm --filter @motion-agent/remotion-studio exec remotion still src/index.ts MotionScene out/motion-scene-still.png --frame=0 --props=jobs/scene-job.json

      - name: Upload compact failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: motion-agent-failure-evidence
          path: |
            apps/remotion-studio/out/motion-scene-still.png
            apps/remotion-studio/out/qa/**/*
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload full preview bundle
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: motion-agent-previews
          path: |
            apps/remotion-studio/out/motion-agent-demo.mp4
            apps/remotion-studio/out/motion-job-preview.mp4
            apps/remotion-studio/out/motion-scene.mp4
            apps/remotion-studio/out/motion-scene-still.png
            apps/remotion-studio/out/qa/qa_preview_smoke/**/*
          if-no-files-found: warn
          retention-days: 3
