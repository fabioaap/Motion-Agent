name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: motion-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: node --test tests/upload-motion-render-to-drive.test.mjs
      - run: pnpm installer:smoke
      - run: pnpm installer:package-smoke
      - run: pnpm tools:smoke
      - run: pnpm --filter @motion-agent/node-tools preview-smoke
      - run: pnpm demo
      - run: pnpm demo:command
      - run: pnpm --filter @motion-agent/remotion-studio compositions
      - run: pnpm render:demo
      - run: pnpm render:job
      - run: pnpm render:scene
      - run: pnpm --filter @motion-agent/remotion-studio exec remotion still src/index.ts MotionScene out/motion-scene-still.png --frame=0 --props=jobs/scene-job.json

      # Outputs stay on the runner only. No Actions Storage artifacts are retained.
