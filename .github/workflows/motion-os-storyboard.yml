name: Motion OS POC-001 storyboard render

on:
  workflow_dispatch:
    inputs:
      quality:
        description: Render quality for review
        type: choice
        required: true
        default: review
        options:
          - review
          - draft
  push:
    branches:
      - feat/aiox-motion-os-drive-first
    paths:
      - "apps/remotion-studio/src/MotionOsStoryboard.tsx"
      - "apps/remotion-studio/src/Root.tsx"
      - ".github/workflows/motion-os-storyboard.yml"
      - "scripts/verify-motion-os-render.py"

permissions:
  contents: read

concurrency:
  group: motion-os-storyboard-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  animatic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Use full resolution on branch pushes; draft mode is opt-in on manual dispatch.
      RENDER_QUALITY: ${{ inputs.quality || 'review' }}
    steps:
      - name: Check out the isolated feature branch
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pinned pnpm version
        run: |
          corepack enable
          corepack pnpm --version

      - name: Install Motion Agent dependencies
        run: corepack pnpm install --no-frozen-lockfile

      - name: Check storyboard TypeScript
        run: corepack pnpm --filter @motion-agent/remotion-studio typecheck

      - name: Render Motion OS animatic in Remotion
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RENDER_QUALITY" = "draft" ]; then
            SCALE="0.5"
          else
            SCALE="1"
          fi
          mkdir -p apps/remotion-studio/out
          corepack pnpm --filter @motion-agent/remotion-studio exec remotion render \
            src/index.ts MotionOsStoryboard \
            out/motion-os-poc001-storyboard.mp4 \
            --scale="$SCALE" --concurrency=2

      - name: Validate video and generate QA contact sheet
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-motion-os-render.py \
            --input apps/remotion-studio/out/motion-os-poc001-storyboard.mp4 \
            --output apps/remotion-studio/out/technical-qa.json \
            --quality "$RENDER_QUALITY"
          ffmpeg -hide_banner -loglevel error -y \
            -i apps/remotion-studio/out/motion-os-poc001-storyboard.mp4 \
            -vf 'fps=1/3,scale=270:480:flags=lanczos,tile=5x1' \
            -frames:v 1 apps/remotion-studio/out/contact-sheet.png

      - name: Upload render, QA report and contact sheet for human review
        uses: actions/upload-artifact@v4
        with:
          name: motion-os-poc001-${{ env.RENDER_QUALITY }}-NOT-FOR-PUBLICATION
          path: |
            apps/remotion-studio/out/motion-os-poc001-storyboard.mp4
            apps/remotion-studio/out/technical-qa.json
            apps/remotion-studio/out/contact-sheet.png
          retention-days: 14
          if-no-files-found: error
