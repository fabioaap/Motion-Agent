name: Motion OS POC-001 storyboard render

on:
  # Render only on manual dispatch; avoid consuming minutes on code pushes.
  workflow_dispatch:
    inputs:
      quality:
        description: Render quality for review
        type: choice
        required: true
        default: review
        options:
          - review
          - draft
permissions:
  contents: read

concurrency:
  group: motion-os-storyboard-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  animatic:
    if: github.ref == 'refs/heads/feat/aiox-motion-os-drive-first'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Use full resolution on branch pushes; draft mode is opt-in on manual dispatch.
      RENDER_QUALITY: ${{ inputs.quality || 'review' }}
    steps:
      - name: Check out the isolated feature branch
        uses: actions/checkout@v4

      - name: Verify private Drive delivery configuration before rendering
        shell: bash
        env:
          MOTION_OS_DRIVE_FOLDER_ID: ${{ vars.MOTION_OS_DRIVE_FOLDER_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          for var in MOTION_OS_DRIVE_FOLDER_ID GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_REFRESH_TOKEN; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing repository variable or secret: $var. See docs/motion-os-drive-runbook.md"
              exit 1
            fi
          done

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pinned pnpm version
        run: |
          corepack enable
          corepack pnpm --version

      - name: Install Motion Agent dependencies
        run: corepack pnpm install --no-frozen-lockfile

      - name: Check storyboard TypeScript
        run: corepack pnpm --filter @motion-agent/remotion-studio typecheck

      - name: Render Motion OS animatic in Remotion
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RENDER_QUALITY" = "draft" ]; then
            SCALE="0.5"
          else
            SCALE="1"
          fi
          mkdir -p apps/remotion-studio/out
          corepack pnpm --filter @motion-agent/remotion-studio exec remotion render \
            src/index.ts MotionOsStoryboard \
            out/motion-os-poc001-storyboard.mp4 \
            --scale="$SCALE" --concurrency=2

      - name: Install FFmpeg and FFprobe for technical QA
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffprobe -version | head -n 1

      - name: Validate video and generate QA contact sheet
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-motion-os-render.py \
            --input apps/remotion-studio/out/motion-os-poc001-storyboard.mp4 \
            --output apps/remotion-studio/out/technical-qa.json \
            --quality "$RENDER_QUALITY"
          ffmpeg -hide_banner -loglevel error -y \
            -i apps/remotion-studio/out/motion-os-poc001-storyboard.mp4 \
            -vf 'fps=1/3,scale=270:480:flags=lanczos,tile=5x1' \
            -frames:v 1 apps/remotion-studio/out/contact-sheet.png

      - name: Deliver MP4, QA and contact sheet directly to Google Drive
        shell: bash
        env:
          MOTION_OS_DRIVE_FOLDER_ID: ${{ vars.MOTION_OS_DRIVE_FOLDER_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          MOTION_WORKFLOW_ID: motion_os_poc001
          MOTION_RENDER_QUALITY: ${{ env.RENDER_QUALITY }}
        run: |
          set -euo pipefail
          node scripts/upload-motion-render-to-drive.mjs \
            apps/remotion-studio/out/motion-os-poc001-storyboard.mp4 \
            apps/remotion-studio/out/technical-qa.json \
            apps/remotion-studio/out/contact-sheet.png
          echo 'Drive delivery verified. No GitHub Actions artifact created.'
